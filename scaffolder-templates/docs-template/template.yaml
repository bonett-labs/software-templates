apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: manipulacao-arquivos-yaml
  title: Manipulate YAML
  description: Repo do componente + sincronizacao de catalog-info.yaml em repositorio central
  tags:
    - yaml
    - yml

spec:
  owner: tribe-web-platforms
  type: website

  parameters:
    - title: Identidade do Componente
      required: [owner, domain, system]
      properties:
        owner:
          title: Dono (Grupo)
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              - kind: Group

        domain:
          title: Dominio de Negocio
          type: string
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              - kind: Domain

        system:
          title: Sistema
          type: string
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              - kind: System

    - title: Dados do Componente
      required: [name, description]
      properties:
        name:
          title: Nome (component_id)
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          description: 'Use kebab-case, ex: billing-api'

        description:
          title: Descricao do componente
          type: string
          ui:widget: textarea
          ui:options:
            rows: 4

  steps:
    - id: resolve-system-prefix
      name: Resolver sigla do sistema
      action: roadiehq:utils:jsonata
      input:
        data:
          system: ${{ parameters.system }}
          componentName: ${{ parameters.name }}
        expression: >
          {
            "systemSlug": $replace(system, "system:default/", ""),
            "systemPrefix": $split($replace(system, "system:default/", ""), "-")[0],
            "repositoryName": $split($replace(system, "system:default/", ""), "-")[0] & "-" & componentName
          }

    - id: ensure-component-repo
      name: Garantir repositorio do componente
      action: zentry:github:repo:ensure
      input:
        repoUrl: github.com?owner=bonett-labs&repo=${{ steps['resolve-system-prefix'].output.result.repositoryName }}
        description: ${{ parameters.description }}
        repoVisibility: private
        defaultBranch: main
        autoInit: true
        hasIssues: false
        hasWiki: false

    - id: fetch-template
      name: Renderizar arquivos do componente
      action: fetch:template
      input:
        url: ./template
        targetPath: component-output
        values:
          component_id: ${{ parameters.name }}
          name: ${{ parameters.name }}
          repository_name: ${{ steps['resolve-system-prefix'].output.result.repositoryName }}
          system_prefix: ${{ steps['resolve-system-prefix'].output.result.systemPrefix }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          domain: ${{ parameters.domain }}
          system: ${{ parameters.system }}

    - id: sync-component-branch
      name: Publicar repositorio do componente
      action: zentry:github:repo:sync-branch
      input:
        repoUrl: github.com?owner=bonett-labs&repo=${{ steps['resolve-system-prefix'].output.result.repositoryName }}
        branch: main
        baseBranch: main
        sourcePath: component-output
        targetPath: .
        createBranchIfMissing: false
        gitCommitMessage: >
          chore(scaffolder): publica componente ${{ parameters.name }}

    - id: fetch-catalog
      name: Renderizar metadata do catalogo
      action: fetch:template
      input:
        url: ./metadata
        targetPath: catalog-output
        values:
          component_id: ${{ parameters.name }}
          name: ${{ parameters.name }}
          repository_name: ${{ steps['resolve-system-prefix'].output.result.repositoryName }}
          system_prefix: ${{ steps['resolve-system-prefix'].output.result.systemPrefix }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          domain: ${{ parameters.domain }}
          system: ${{ parameters.system }}

    - id: sync-catalog-branch
      name: Sincronizar metadata em branch do catalogo
      action: zentry:github:repo:sync-branch
      input:
        repoUrl: github.com?owner=bonett-labs&repo=bonettech-zentry-components
        branch: add-${{ parameters.name }}
        baseBranch: main
        sourcePath: ./catalog-output
        targetPath: ${{ steps['resolve-system-prefix'].output.result.systemSlug }}
        createBranchIfMissing: true
        gitCommitMessage: >
          feat(catalog): adiciona ${{ parameters.name }}.yaml

  output:
    text:
      - title: Resultado
        content: |
          Repositorio do componente: `bonett-labs/${{ steps['resolve-system-prefix'].output.result.repositoryName }}`
          Branch publicada no catalogo central: `add-${{ parameters.name }}`
          Arquivo sincronizado: `${{ steps['resolve-system-prefix'].output.result.systemSlug }}/${{ parameters.name }}.yaml`
    links:
      - title: Repositorio do componente
        url: ${{ steps['sync-component-branch'].output.repoContentsUrl }}
      - title: Branch do catalogo central
        url: ${{ steps['sync-catalog-branch'].output.repoContentsUrl }}
